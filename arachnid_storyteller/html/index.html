<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Arachnid Storyteller</title>
  <style>
    #story-beat{display:none;position:absolute;left:50%;top:9%;transform:translateX(-50%);width:min(650px,88vw);z-index:30;text-align:center;pointer-events:none;border:1px solid #c49a59;border-radius:5px;background:linear-gradient(135deg,#161a16ee,#302515ee);box-shadow:0 12px 38px #000b;padding:17px 24px;color:#f4e7ce}#story-beat.visible{display:block;animation:beat-enter .28s ease-out}@keyframes beat-enter{from{opacity:0;transform:translate(-50%,-12px)}to{opacity:1;transform:translate(-50%,0)}}#story-beat small{display:block;color:#d6aa65;letter-spacing:3px;font-size:10px;margin-bottom:8px}#story-beat strong{display:block;color:#f1d095;font-size:24px;letter-spacing:1px;margin-bottom:7px}#story-beat p{margin:0;color:#dfd0b5;line-height:1.4;white-space:pre-wrap}
    :root{font-family:Georgia,'Times New Roman',serif;color:#eee0c6;--gold:#c49a59;--line:#785c37;--ink:#101717}*{box-sizing:border-box}body{margin:0;background:transparent}#app{display:none;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(1420px,95vw);height:min(850px,91vh);min-height:0;flex-direction:column;overflow:hidden;border:2px solid #a77d42;border-radius:10px;background:#101717;box-shadow:0 24px 100px #000e,0 0 0 5px #12120f,0 0 0 7px #61482a}#app:before{content:'';position:absolute;inset:8px;border:1px solid #8b693d77;border-radius:5px;pointer-events:none;z-index:5}header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-shrink:0;min-height:150px;padding:24px 42px;background:radial-gradient(ellipse at 80% 25%,#6c522e55,transparent 50%),linear-gradient(110deg,#0b1112 10%,#192121 55%,#302b20);border-bottom:2px solid #a47b42}header:after{content:'✦  GAMEMASTER CONSOLE  ✦';position:absolute;top:119px;left:42px;font-size:10px;letter-spacing:3px;color:#c7a36a}header small{letter-spacing:5px;color:#d6aa65;font-size:12px;font-weight:bold}h1{font-size:clamp(25px,3vw,40px);letter-spacing:3px;margin:8px 0 14px;text-shadow:0 2px 5px #000}button{font:inherit;cursor:pointer;color:#f0dec0;border:1px solid #947246;background:linear-gradient(#4c3a26,#32291f);padding:10px 16px;border-radius:4px;transition:background .15s,border-color .15s}button:hover{background:#654b2c;border-color:#d0a569}button:disabled{opacity:.5;cursor:not-allowed}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #d7ae70;outline-offset:2px}header button{position:relative;z-index:6}main{display:flex;min-height:0;flex:1;background:radial-gradient(circle at 80% 90%,#49371c33,transparent 55%),linear-gradient(110deg,#0e1718,#171b19 65%,#201f19)}nav{width:245px;flex-shrink:0;background:#0d1516d9;border-right:1px solid #896a3e;padding:23px 13px;overflow:auto}nav:before{content:'STORY SYSTEM';display:block;font-size:10px;letter-spacing:2px;color:#ba9357;padding:0 12px 16px}nav div{display:flex;align-items:center;gap:12px;width:100%;margin:3px 0;padding:13px 15px;border:1px solid #c29a5b;background:linear-gradient(90deg,#54402b,#2b2b24);color:#fff0d1;box-shadow:inset 3px 0 #d4ac6b}nav div:before{content:'◆';font-size:10px;color:#d4ac6b}nav p{padding:15px 10px;color:#baad95;font-size:13px;line-height:1.5}section{flex:1;min-width:0;padding:30px 38px;overflow:auto}section>h2{font-size:35px;letter-spacing:1px;color:#f1e2c7;margin:0 0 16px;padding-bottom:15px;border-bottom:1px solid #9e7847}h2:before{content:'✦';font-size:17px;color:#d3a45c;margin-right:13px;vertical-align:middle}h3{color:#d6ac6a;letter-spacing:1px}.muted{color:#baad95;line-height:1.5}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:14px;margin:18px 0}.card{min-width:0;border:1px solid #69573a;background:linear-gradient(145deg,#2b2d27,#1a2423);padding:19px;border-radius:5px;box-shadow:inset 0 1px #a1844130}.card strong{display:block;font-size:21px;color:#e4b875;margin-bottom:8px}.item-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;align-items:start}.item-grid .card{padding:14px}.item-grid .card strong,.item-grid .card p{overflow-wrap:anywhere}.item-grid .card strong{font-size:17px}.item-grid .card button{margin-top:8px}input,select,textarea{font:inherit;background:#171f1e;color:#f3e5ce;border:1px solid #8a6d42;padding:11px 12px;margin:8px 8px 8px 0;max-width:100%;border-radius:3px}textarea{display:block;width:min(780px,100%);min-height:100px;resize:vertical;line-height:1.4}input::placeholder,textarea::placeholder{color:#a89b83}label{display:block;color:#d9c9ac;margin:10px 0}.danger{border-color:#ac5b50;color:#ffd3c6}.tag{display:inline-block;font-size:11px;letter-spacing:1px;padding:4px 7px;border:1px solid #8c7144;border-radius:3px;color:#e9c984;text-transform:uppercase}.story-summary{white-space:pre-wrap;overflow-wrap:anywhere;background:#141d1c;padding:13px;margin-top:9px;border:1px solid #574831}.overlay{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:#000b;padding:24px}.overlay .card{max-width:520px;width:100%;border:2px solid #c49a59;box-shadow:0 15px 50px #000}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}footer{flex-shrink:0;border-top:1px solid #8e6b3e;padding:13px 30px;background:#101615;color:#c9a572;font-size:11px;letter-spacing:2px}nav::-webkit-scrollbar,section::-webkit-scrollbar{width:6px}nav::-webkit-scrollbar-thumb,section::-webkit-scrollbar-thumb{background:#86643b;border-radius:6px}@media(max-width:800px){#app{width:97vw;height:94vh}header{min-height:130px;padding:17px 22px}header:after{top:104px;left:22px}nav{width:180px;padding:14px 7px}section{padding:20px}section>h2{font-size:27px}}
  </style>
</head>
<body>
  <div id="app">
    <header><div><small>ARACHNID</small><h1>STORYTELLER</h1></div><div><button id="refresh">Refresh</button> <button id="close">Close ×</button></div></header>
    <main><nav><div>Story Library</div><p>Plan persistent story arcs and scene beats. Runtime playback is intentionally not enabled in this foundation release.</p></nav><section id="content"></section></main>
    <footer>GAMEMASTER ACCESS ONLY · /STTOOL / ESC TO CLOSE</footer>
  </div>
  <div id="story-beat"><small id="beat-story"></small><strong id="beat-title"></strong><p id="beat-objective"></p></div>
  <script>
    const app=document.getElementById('app'),content=document.getElementById('content'),storyBeat=document.getElementById('story-beat'),beatStory=document.getElementById('beat-story'),beatTitle=document.getElementById('beat-title'),beatObjective=document.getElementById('beat-objective');let state=null,feedback='',selectedStory=null,selectedScene=null,beatTimer=null;
    function node(tag,text,cls){const element=document.createElement(tag);if(text!==undefined)element.textContent=String(text);if(cls)element.className=cls;return element}
    function send(action,data={}){return fetch('https://'+GetParentResourceName()+'/'+action,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}).catch(()=>{})}
    function close(){app.style.display='none';state=null;send('close')}
    function confirmAction(message,callback){const overlay=node('div',undefined,'overlay'),panel=node('div',undefined,'card'),actions=node('div',undefined,'actions'),cancel=node('button','Cancel'),confirm=node('button','Confirm action','danger');panel.append(node('h3','Confirm gamemaster action'),node('p',message,'muted'));cancel.onclick=()=>overlay.remove();confirm.onclick=()=>{overlay.remove();callback()};actions.append(cancel,confirm);panel.append(actions);overlay.append(panel);app.append(overlay)}
    function showSession(payload){clearTimeout(beatTimer);if(!payload||payload.state!=='active'||!payload.scene){storyBeat.classList.remove('visible');return}beatStory.textContent='ARACHNID STORYTELLER · '+(payload.story?.title||'LIVE SESSION');beatTitle.textContent=payload.scene.title||'Scene beat';beatObjective.textContent=payload.scene.objective||'';storyBeat.classList.add('visible');beatTimer=setTimeout(()=>storyBeat.classList.remove('visible'),Math.max(2500,Number(payload.duration)||12000))}
    function render(){if(!state)return;content.replaceChildren();content.append(node('h2','Story Library'));content.append(node('p','Create arcs, record player-facing objectives, and sequence the beats that now drive a live gamemaster session. All changes are stored server-side and audited.','muted'));if(feedback)content.append(node('p',feedback,'muted'));if(state.session?.state==='active'){const live=node('div',undefined,'card');live.append(node('h3','Live session in progress'),node('strong',state.session.story?.title||'Untitled story'),node('p','Current beat: '+(state.session.scene?.title||'No active beat'),'muted'));const end=node('button','End live session','danger');end.onclick=()=>confirmAction('End the current live story session for every player?',()=>send('sessionStop'));live.append(end);content.append(live)}const stories=(state.stories||[]).slice(),published=stories.filter(s=>s.status==='published').length,drafts=stories.filter(s=>s.status==='draft').length,beats=stories.reduce((count,story)=>count+(story.scenes||[]).length,0),stats=node('div',undefined,'cards');for(const [value,label] of [[stories.length,'Story arcs'],[published,'Published'],[drafts,'Drafts'],[beats,'Scene beats']]){const card=node('div',undefined,'card');card.append(node('strong',value),node('span',label));stats.append(card)}content.append(stats);
      const library=node('div',undefined,'card');library.append(node('h3','Select or create an arc'));const picker=node('select');for(const story of stories){const option=node('option','#'+story.id+' · '+story.title+' ['+story.status+']');option.value=String(story.id);picker.append(option)}if(selectedStory==='new')picker.value='';else if(!stories.some(story=>String(story.id)===String(selectedStory)))selectedStory=stories[0]?.id||'new';if(selectedStory!=='new')picker.value=String(selectedStory);picker.disabled=!stories.length;picker.onchange=()=>{selectedStory=Number(picker.value);selectedScene=null;render()};const create=node('button','Create story arc');create.onclick=()=>{selectedStory='new';selectedScene=null;render()};library.append(picker,create);content.append(library);
      const story=selectedStory==='new'?{title:'',summary:'',status:'draft',scenes:[]}:stories.find(entry=>String(entry.id)===String(selectedStory));if(!story){content.append(node('p','Create the first story arc to begin using Arachnid Storyteller.','muted'));return}
      const editor=node('div',undefined,'card');editor.append(node('h3',story.id?'Edit story arc #'+story.id:'New story arc'));const title=node('input');title.placeholder='Story title (up to 100 characters)';title.maxLength=100;title.value=story.title||'';const status=node('select');for(const value of ['draft','published','archived']){const option=node('option',value.charAt(0).toUpperCase()+value.slice(1));option.value=value;status.append(option)}status.value=story.status||'draft';const summary=node('textarea');summary.placeholder='Premise, player hooks, consent notes, and facilitator guidance (up to 4,000 characters)';summary.maxLength=4000;summary.value=story.summary||'';const save=node('button',story.id?'Save story arc':'Create story arc');save.onclick=()=>{if(!title.value.trim()){title.focus();return}send('storySave',{story:{id:story.id,title:title.value,summary:summary.value,status:status.value}})};editor.append(title,status,summary,save);if(story.id){const remove=node('button','Delete story arc and all beats','danger');remove.onclick=()=>confirmAction('Delete “'+story.title+'” and every scene beat it contains? This cannot be undone.',()=>{selectedStory=null;selectedScene=null;send('storyDelete',{id:story.id})});editor.append(remove)}content.append(editor);if(!story.id)return;
      const scenes=(story.scenes||[]).slice().sort((a,b)=>Number(a.sort_order)-Number(b.sort_order)||Number(a.id)-Number(b.id));const liveForStory=state.session?.state==='active'&&Number(state.session.story?.id)===Number(story.id);const sessionCard=node('div',undefined,'card');sessionCard.append(node('h3','Session controls'));if(liveForStory){sessionCard.append(node('p','This story is live. Current beat: '+(state.session.scene?.title||'Unknown')+'.','muted'));const next=node('button','Advance to next scene');next.onclick=()=>send('sessionNext');const stop=node('button','End live session','danger');stop.onclick=()=>confirmAction('End the live session for “'+story.title+'”?',()=>send('sessionStop'));sessionCard.append(next,stop)}else if(state.session?.state==='active'){sessionCard.append(node('p','“'+(state.session.story?.title||'Another story')+'” is currently live. End it before starting this arc.','muted'))}else if(story.status!=='published'){sessionCard.append(node('p','Publish this story before starting a live session.','muted'))}else if(!scenes.length){sessionCard.append(node('p','Add at least one scene beat before starting a live session.','muted'))}else{sessionCard.append(node('p','Starting a session announces the first scene beat to connected players.','muted'));const start=node('button','Start live session');start.onclick=()=>confirmAction('Start “'+story.title+'” for connected players?',()=>send('sessionStart',{storyId:story.id}));sessionCard.append(start)}content.append(sessionCard);
      content.append(node('h3','Scene beats'));const newScene=node('button','Add scene beat');newScene.onclick=()=>{selectedScene='new';render()};content.append(newScene);const scene=selectedScene==='new'?{story_id:story.id,title:'',objective:'',sort_order:scenes.length+1}:scenes.find(entry=>String(entry.id)===String(selectedScene));if(scene){const sceneEditor=node('div',undefined,'card');sceneEditor.append(node('h3',scene.id?'Edit scene beat #'+scene.id:'New scene beat'));const sceneTitle=node('input');sceneTitle.placeholder='Scene title (up to 100 characters)';sceneTitle.maxLength=100;sceneTitle.value=scene.title||'';const order=node('input');order.type='number';order.min='1';order.max='10000';order.step='1';order.value=String(scene.sort_order||scenes.length+1);const objective=node('textarea');objective.placeholder='What should happen, what players should learn, and success conditions (up to 1,000 characters)';objective.maxLength=1000;objective.value=scene.objective||'';const capture=document.createElement('input');capture.type='checkbox';capture.checked=!scene.id;const captureLabel=node('label',' Capture my current in-game position when saving');captureLabel.prepend(capture);const saveScene=node('button',scene.id?'Save scene beat':'Create scene beat');saveScene.onclick=()=>{if(!sceneTitle.value.trim()){sceneTitle.focus();return}const sortOrder=Number(order.value);if(!Number.isSafeInteger(sortOrder)||sortOrder<1||sortOrder>10000){order.focus();return}send('sceneSave',{scene:{id:scene.id,storyId:story.id,title:sceneTitle.value,objective:objective.value,sortOrder,capturePosition:capture.checked}})};sceneEditor.append(sceneTitle,order,objective,captureLabel,saveScene);if(scene.id){const removeScene=node('button','Delete scene beat','danger');removeScene.onclick=()=>confirmAction('Delete scene beat “'+scene.title+'”? This cannot be undone.',()=>{selectedScene=null;send('sceneDelete',{id:scene.id})});sceneEditor.append(removeScene)}content.append(sceneEditor)}
      const sceneList=node('div',undefined,'item-grid');for(const entry of scenes){const card=node('div',undefined,'card');card.append(node('strong',entry.sort_order+'. '+entry.title),node('p',entry.objective||'No objective notes yet.','muted'));const position=entry.x!=null&&entry.y!=null&&entry.z!=null?'Location: '+[entry.x,entry.y,entry.z].map(value=>Number(value).toFixed(2)).join(', '):'No saved world location';card.append(node('p',position,'muted'));const edit=node('button',selectedScene===entry.id?'Editing':'Edit scene');edit.onclick=()=>{selectedScene=entry.id;render()};card.append(edit);if(liveForStory){const run=node('button','Run this beat now');run.onclick=()=>confirmAction('Announce “'+entry.title+'” as the active scene beat?',()=>send('sessionSelectScene',{sceneId:entry.id}));card.append(run)}sceneList.append(card)}content.append(sceneList);if(!scenes.length)content.append(node('p','No scene beats yet. Add one to turn this story arc into a playable plan.','muted'))}
    window.addEventListener('message',event=>{const data=event.data||{};if(data.action==='open'){state=data.payload;feedback='';selectedStory=null;selectedScene=null;app.style.display='flex';render()}else if(data.action==='data'){state=data.payload;render()}else if(data.action==='session'){showSession(data.payload);if(state){state.session=data.payload?.state==='active'?data.payload:null;render()}}else if(data.action==='feedback'){feedback=data.message||'';render()}else if(data.action==='select'){const choice=data.payload||{};if(choice.storyId!=null)selectedStory=Number(choice.storyId);if(choice.sceneId!=null)selectedScene=Number(choice.sceneId)}else if(data.action==='close'){app.style.display='none';state=null}});
    window.addEventListener('keydown',event=>{if(event.key==='Escape'){event.preventDefault();if(state)close()}});document.getElementById('close').onclick=close;document.getElementById('refresh').onclick=()=>send('refresh');
  </script>
</body>
</html>
