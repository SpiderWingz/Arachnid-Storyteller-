<html lang="en">
<head>

  <title>Arachnid Storyteller</title>
  <style>
    #story-beat{display:none;position:absolute;left:50%;top:9%;transform:translateX(-50%);width:min(650px,88vw);z-index:30;text-align:center;pointer-events:none;border:1px solid #c49a59;border-radius:5px;background:linear-gradient(135deg,#161a16ee,#302515ee);box-shadow:0 12px 38px #000b;padding:17px 24px;color:#f4e7ce}#story-beat.visible{display:block;animation:beat-enter .28s ease-out}@keyframes beat-enter{from{opacity:0;transform:translate(-50%,-12px)}to{opacity:1;transform:translate(-50%,0)}}#story-beat small{display:block;color:#d6aa65;letter-spacing:3px;font-size:10px;margin-bottom:8px}#story-beat strong{display:block;color:#f1d095;font-size:24px;letter-spacing:1px;margin-bottom:7px}#story-beat p{margin:0;color:#dfd0b5;line-height:1.4;white-space:pre-wrap}#story-objective{display:none;position:absolute;right:3.5vw;bottom:8vh;width:min(360px,80vw);z-index:30;pointer-events:none;border-left:4px solid #c49a59;border-radius:4px;background:#121a19ed;box-shadow:0 10px 30px #0009;padding:14px 17px;color:#f4e7ce}#story-objective.visible{display:block}#story-objective.completed{border-left-color:#67b66b}#story-objective.failed{border-left-color:#bd6254}#story-objective small{display:block;color:#d6aa65;letter-spacing:2px;font-size:10px;margin-bottom:6px}#story-objective strong{display:block;color:#f1d095;font-size:18px;margin-bottom:6px}#story-objective p{margin:0;color:#dfd0b5;line-height:1.4;white-space:pre-wrap}#story-action-message{display:none;position:absolute;top:24%;left:50%;transform:translateX(-50%);width:min(600px,88vw);z-index:31;text-align:center;pointer-events:none;border:1px solid #c49a59;border-radius:5px;background:#121a19f2;box-shadow:0 12px 38px #000b;padding:15px 22px;color:#f4e7ce}#story-action-message.visible{display:block}#story-action-message small{display:block;color:#d6aa65;letter-spacing:2px;font-size:10px;margin-bottom:6px}#story-action-message p{margin:0;color:#f1e2c7;line-height:1.45;white-space:pre-wrap}
    :root{font-family:Georgia,'Times New Roman',serif;color:#eee0c6;--gold:#c49a59;--line:#785c37;--ink:#101717}*{box-sizing:border-box}body{margin:0;background:transparent}#app{display:none;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(1420px,95vw);height:min(850px,91vh);min-height:0;flex-direction:column;overflow:hidden;border:2px solid #a77d42;border-radius:10px;background:#101717;box-shadow:0 24px 100px #000e,0 0 0 5px #12120f,0 0 0 7px #61482a}#app:before{content:'';position:absolute;inset:8px;border:1px solid #8b693d77;border-radius:5px;pointer-events:none;z-index:5}header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-shrink:0;min-height:150px;padding:24px 42px;background:radial-gradient(ellipse at 80% 25%,#6c522e55,transparent 50%),linear-gradient(110deg,#0b1112 10%,#192121 55%,#302b20);border-bottom:2px solid #a47b42}header:after{content:'✦  GAMEMASTER CONSOLE  ✦';position:absolute;top:119px;left:42px;font-size:10px;letter-spacing:3px;color:#c7a36a}header small{letter-spacing:5px;color:#d6aa65;font-size:12px;font-weight:bold}h1{font-size:clamp(25px,3vw,40px);letter-spacing:3px;margin:8px 0 14px;text-shadow:0 2px 5px #000}button{font:inherit;cursor:pointer;color:#f0dec0;border:1px solid #947246;background:linear-gradient(#4c3a26,#32291f);padding:10px 16px;border-radius:4px;transition:background .15s,border-color .15s}button:hover{background:#654b2c;border-color:#d0a569}button:disabled{opacity:.5;cursor:not-allowed}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #d7ae70;outline-offset:2px}header button{position:relative;z-index:6}main{display:flex;min-height:0;flex:1;background:radial-gradient(circle at 80% 90%,#49371c33,transparent 55%),linear-gradient(110deg,#0e1718,#171b19 65%,#201f19)}nav{width:245px;flex-shrink:0;background:#0d1516d9;border-right:1px solid #896a3e;padding:23px 13px;overflow:auto}nav:before{content:'STORY SYSTEM';display:block;font-size:10px;letter-spacing:2px;color:#ba9357;padding:0 12px 16px}nav div{display:flex;align-items:center;gap:12px;width:100%;margin:3px 0;padding:13px 15px;border:1px solid #c29a5b;background:linear-gradient(90deg,#54402b,#2b2b24);color:#fff0d1;box-shadow:inset 3px 0 #d4ac6b}nav div:before{content:'◆';font-size:10px;color:#d4ac6b}nav p{padding:15px 10px;color:#baad95;font-size:13px;line-height:1.5}section{flex:1;min-width:0;padding:30px 38px;overflow:auto}section>h2{font-size:35px;letter-spacing:1px;color:#f1e2c7;margin:0 0 16px;padding-bottom:15px;border-bottom:1px solid #9e7847}h2:before{content:'✦';font-size:17px;color:#d3a45c;margin-right:13px;vertical-align:middle}h3{color:#d6ac6a;letter-spacing:1px}.muted{color:#baad95;line-height:1.5}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:14px;margin:18px 0}.card{min-width:0;border:1px solid #69573a;background:linear-gradient(145deg,#2b2d27,#1a2423);padding:19px;border-radius:5px;box-shadow:inset 0 1px #a1844130}.card strong{display:block;font-size:21px;color:#e4b875;margin-bottom:8px}.item-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;align-items:start}.item-grid .card{padding:14px}.item-grid .card strong,.item-grid .card p{overflow-wrap:anywhere}.item-grid .card strong{font-size:17px}.item-grid .card button{margin-top:8px}input,select,textarea{font:inherit;background:#171f1e;color:#f3e5ce;border:1px solid #8a6d42;padding:11px 12px;margin:8px 8px 8px 0;max-width:100%;border-radius:3px}textarea{display:block;width:min(780px,100%);min-height:100px;resize:vertical;line-height:1.4}input::placeholder,textarea::placeholder{color:#a89b83}label{display:block;color:#d9c9ac;margin:10px 0}.danger{border-color:#ac5b50;color:#ffd3c6}.tag{display:inline-block;font-size:11px;letter-spacing:1px;padding:4px 7px;border:1px solid #8c7144;border-radius:3px;color:#e9c984;text-transform:uppercase}.story-summary{white-space:pre-wrap;overflow-wrap:anywhere;background:#141d1c;padding:13px;margin-top:9px;border:1px solid #574831}.overlay{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:#000b;padding:24px}.overlay .card{max-width:520px;width:100%;border:2px solid #c49a59;box-shadow:0 15px 50px #000}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}footer{flex-shrink:0;border-top:1px solid #8e6b3e;padding:13px 30px;background:#101615;color:#c9a572;font-size:11px;letter-spacing:2px}nav::-webkit-scrollbar,section::-webkit-scrollbar{width:6px}nav::-webkit-scrollbar-thumb,section::-webkit-scrollbar-thumb{background:#86643b;border-radius:6px}@media(max-width:800px){#app{width:97vw;height:94vh}header{min-height:130px;padding:17px 22px}header:after{top:104px;left:22px}nav{width:180px;padding:14px 7px}section{padding:20px}section>h2{font-size:27px}}
    .rts-overlay{position:fixed;inset:0;z-index:1000;display:flex;justify-content:center;align-items:center;overflow:auto;padding:18px;background:#050909f5;color:#eee0c6;font-family:Arial,sans-serif}
    .rts-shell{width:min(1600px,100%);max-height:100%;display:flex;flex-direction:column;gap:12px;padding:18px;border:1px solid #a77d42;border-radius:8px;background:linear-gradient(145deg,#18201f,#0c1213 70%);box-shadow:0 24px 90px #000}
    .rts-header{position:relative;min-height:0;padding:6px 4px 14px;border-bottom:1px solid #6d5737;background:none}
    .rts-header:after{content:none}
    .rts-header h2{margin:5px 0;color:#f1d095;font-size:23px;letter-spacing:2px}
    .rts-header h2:before{content:none}
    .rts-header p{margin:5px 0}
    .rts-header small{font-size:10px;letter-spacing:2px;color:#d6aa65}
    .rts-header button{flex-shrink:0}
    .rts-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(220px,290px);gap:12px;min-height:0;flex:1}
    .rts-board-panel,.rts-roster-panel,.rts-command-bar{min-width:0;padding:14px;border:1px solid #59482f;border-radius:5px;background:#111918}
    .rts-board-panel{display:flex;flex-direction:column;gap:8px;overflow:hidden}
    .rts-board-heading{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
    .rts-board-heading h3,.rts-roster-panel h3,.rts-command-section h3{margin:0;font-size:15px}
    .rts-board-heading span{font-size:12px}
    .rts-map-controls{display:flex;gap:5px;margin-left:auto}
    .rts-map-controls button{min-width:34px;padding:6px 9px;font-family:Arial,sans-serif}
    .rts-board{display:block;width:100%;height:min(52vh,650px);min-height:280px;border:1px solid #655233;background:#0c1415;cursor:crosshair;touch-action:none}
    .rts-board:active{cursor:grabbing}
    .rts-board-panel>p{margin:0;font-size:12px}
    .rts-roster-panel{overflow:auto}
    .rts-roster{display:flex;flex-direction:column;gap:7px;margin-top:12px}
    .rts-unit-card{display:flex;flex-direction:column;align-items:flex-start;gap:5px;width:100%;padding:10px;text-align:left;background:#18201e;border-color:#514630}
    .rts-unit-card strong{font-size:13px;color:#f0dec0;overflow-wrap:anywhere}
    .rts-unit-card span{font-size:11px;color:#baad95}
    .rts-unit-card.selected{border-color:#e1b963;background:#3b3020;box-shadow:inset 3px 0 #e1b963}
    .rts-command-bar{display:grid;grid-template-columns:minmax(180px,.8fr) minmax(290px,1.2fr) minmax(280px,1fr);gap:14px}
    .rts-command-section{min-width:0;padding:12px;border:1px solid #403a2c;border-radius:4px;background:#151c1b}
    .rts-command-section h3{margin-bottom:10px}
    .rts-command-section .flow-field{display:block;margin:6px 0;font-size:12px}
    .rts-command-section input,.rts-command-section select{width:100%;margin:5px 0 8px;padding:8px}
    .rts-command-section button{margin:4px 4px 4px 0;padding:8px 10px;font-size:12px}
    .rts-command-section h4{margin:12px 0 5px;color:#d6aa65;font-size:12px}
    .rts-stances{display:flex;flex-wrap:wrap;gap:4px;margin:7px 0}
    .rts-stances button{flex:1}
    .rts-command-section .muted{font-size:12px}
    .rts-shell>p{margin:0;font-size:11px}
    @media(max-width:1000px){.rts-overlay{align-items:flex-start}.rts-shell{max-height:none}.rts-layout{grid-template-columns:1fr}.rts-roster-panel{max-height:220px}.rts-command-bar{grid-template-columns:1fr 1fr}.rts-command-section:first-child{grid-column:1/-1}.rts-board{height:46vh}}
    @media(max-width:650px){.rts-overlay{padding:7px}.rts-shell{padding:10px}.rts-command-bar{grid-template-columns:1fr}.rts-command-section:first-child{grid-column:auto}.rts-board{min-height:220px;height:40vh}.rts-header{align-items:flex-start;padding:6px}.rts-header h2{font-size:18px}}
  </style>
</head>
<body>
  <div id="app">
    <header><div><small>ARACHNID</small><h1>STORYTELLER</h1></div><div><button id="refresh">Refresh</button> <button id="close">Close ×</button></div></header>
    <main><nav><div>Story Library</div><p>Plan persistent story arcs, connect branching flows, and run them as live gamemaster sessions.</p></nav><section id="content"></section></main>
    <footer>GAMEMASTER ACCESS ONLY · /STTOOL / ESC TO CLOSE</footer>
  </div>
  <div id="story-beat"><small id="beat-story"></small><strong id="beat-title"></strong><p id="beat-objective"></p></div>
  <div id="story-objective"><small id="objective-status"></small><strong>Current objective</strong><p id="objective-text"></p></div>
  <div id="story-action-message"><small id="action-message-title"></small><p id="action-message-text"></p></div>
  <div id="cutscene-overlay" style="display:none;position:absolute;left:50%;bottom:16%;transform:translateX(-50%);z-index:40;max-width:80vw;padding:10px 20px;text-align:center;color:#f4e7ce;background:#101717dd;border:1px solid #c49a59;border-radius:4px;pointer-events:none;white-space:pre-wrap"></div>
  <div id="story-effect-overlay" style="display:none;position:absolute;left:50%;top:14%;transform:translateX(-50%);z-index:42;max-width:84vw;padding:15px 24px;text-align:center;color:#f4e7ce;background:#101717ed;border:1px solid #c49a59;border-radius:4px;box-shadow:0 10px 35px #0009;pointer-events:none;white-space:pre-wrap"></div>
  <script>
    const app=document.getElementById('app'),content=document.getElementById('content'),storyBeat=document.getElementById('story-beat'),beatStory=document.getElementById('beat-story'),beatTitle=document.getElementById('beat-title'),beatObjective=document.getElementById('beat-objective'),storyObjective=document.getElementById('story-objective'),objectiveStatus=document.getElementById('objective-status'),objectiveText=document.getElementById('objective-text'),storyActionMessage=document.getElementById('story-action-message'),actionMessageTitle=document.getElementById('action-message-title'),actionMessageText=document.getElementById('action-message-text');let state=null,feedback='',selectedStory=null,selectedScene=null,selectedCameraPoint=null,sessionAudienceMode='all',sessionParticipants=[],sessionAudienceAreaId=null,beatTimer=null,actionMessageTimer=null;
    function node(tag,text,cls){const element=document.createElement(tag);if(text!==undefined)element.textContent=String(text);if(cls)element.className=cls;return element}
    function send(action,data={}){return fetch('https://'+GetParentResourceName()+'/'+action,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}).catch(()=>{})}
    function close(){app.style.display='none';state=null;send('close')}
    function confirmAction(message,callback){const overlay=node('div',undefined,'overlay'),panel=node('div',undefined,'card'),actions=node('div',undefined,'actions'),cancel=node('button','Cancel'),confirm=node('button','Confirm action','danger');panel.append(node('h3','Confirm gamemaster action'),node('p',message,'muted'));cancel.onclick=()=>overlay.remove();confirm.onclick=()=>{overlay.remove();callback()};actions.append(cancel,confirm);panel.append(actions);overlay.append(panel);app.append(overlay)}
    function showSession(payload){clearTimeout(beatTimer);if(!payload||payload.state!=='active'||!payload.scene){storyBeat.classList.remove('visible');return}beatStory.textContent='ARACHNID STORYTELLER · '+(payload.story?.title||'LIVE SESSION');beatTitle.textContent=payload.scene.title||'Scene beat';beatObjective.textContent=payload.scene.objective||'';storyBeat.classList.add('visible');beatTimer=setTimeout(()=>storyBeat.classList.remove('visible'),Math.max(2500,Number(payload.duration)||12000))}
    function showObjective(payload){const objective=payload?.objective,status=String(objective?.status||'none');if(!payload||payload.state!=='active'||!objective||!String(objective.text||'').trim()||status==='none'){storyObjective.className='';return}storyObjective.className='visible '+status;objectiveStatus.textContent='OBJECTIVE · '+status.toUpperCase();objectiveText.textContent=objective.text}
    function showActionMessage(payload){clearTimeout(actionMessageTimer);if(!payload||!String(payload.text||'').trim()){storyActionMessage.classList.remove('visible');return}actionMessageTitle.textContent=payload.title||'ARACHNID STORYTELLER';actionMessageText.textContent=payload.text;storyActionMessage.classList.add('visible');actionMessageTimer=setTimeout(()=>storyActionMessage.classList.remove('visible'),Math.min(15000,Math.max(1500,Number(payload.duration)||7000)))}
    function render(){if(!state)return;content.replaceChildren();content.append(node('h2','Story Library'));content.append(node('p','Create arcs, record player-facing objectives, and sequence the beats that now drive a live gamemaster session. All changes are stored server-side and audited.','muted'));if(feedback)content.append(node('p',feedback,'muted'));if(state.session?.state==='active'){const live=node('div',undefined,'card');live.append(node('h3','Live session in progress'),node('strong',state.session.story?.title||'Untitled story'),node('p','Current beat: '+(state.session.scene?.title||'No active beat'),'muted'));const end=node('button','End live session','danger');end.onclick=()=>confirmAction('End the current live story session for every player?',()=>send('sessionStop'));live.append(end);content.append(live)}const stories=(state.stories||[]).slice(),published=stories.filter(s=>s.status==='published').length,drafts=stories.filter(s=>s.status==='draft').length,beats=stories.reduce((count,story)=>count+(story.scenes||[]).length,0),stats=node('div',undefined,'cards');for(const [value,label] of [[stories.length,'Story arcs'],[published,'Published'],[drafts,'Drafts'],[beats,'Scene beats']]){const card=node('div',undefined,'card');card.append(node('strong',value),node('span',label));stats.append(card)}content.append(stats);
      const library=node('div',undefined,'card');library.append(node('h3','Select or create an arc'));const picker=node('select');for(const story of stories){const option=node('option','#'+story.id+' · '+story.title+' ['+story.status+']');option.value=String(story.id);picker.append(option)}if(selectedStory==='new')picker.value='';else if(!stories.some(story=>String(story.id)===String(selectedStory)))selectedStory=stories[0]?.id||'new';if(selectedStory!=='new')picker.value=String(selectedStory);picker.disabled=!stories.length;picker.onchange=()=>{selectedStory=Number(picker.value);selectedScene=null;selectedCameraPoint=null;sessionParticipants=[];render()};const create=node('button','Create story arc');create.onclick=()=>{selectedStory='new';selectedScene=null;selectedCameraPoint=null;sessionParticipants=[];render()};library.append(picker,create);content.append(library);
      const story=selectedStory==='new'?{title:'',summary:'',status:'draft',scenes:[]}:stories.find(entry=>String(entry.id)===String(selectedStory));if(!story){content.append(node('p','Create the first story arc to begin using Arachnid Storyteller.','muted'));return}
      const editor=node('div',undefined,'card');editor.append(node('h3',story.id?'Edit story arc #'+story.id:'New story arc'));const title=node('input');title.placeholder='Story title (up to 100 characters)';title.maxLength=100;title.value=story.title||'';const status=node('select');for(const value of ['draft','published','archived']){const option=node('option',value.charAt(0).toUpperCase()+value.slice(1));option.value=value;status.append(option)}status.value=story.status||'draft';const summary=node('textarea');summary.placeholder='Premise, player hooks, consent notes, and facilitator guidance (up to 4,000 characters)';summary.maxLength=4000;summary.value=story.summary||'';const save=node('button',story.id?'Save story arc':'Create story arc');save.onclick=()=>{if(!title.value.trim()){title.focus();return}send('storySave',{story:{id:story.id,title:title.value,summary:summary.value,status:status.value}})};editor.append(title,status,summary,save);if(story.id){const remove=node('button','Delete story arc and all beats','danger');remove.onclick=()=>confirmAction('Delete “'+story.title+'” and every scene beat it contains? This cannot be undone.',()=>{selectedStory=null;selectedScene=null;selectedCameraPoint=null;send('storyDelete',{id:story.id})});editor.append(remove)}content.append(editor);if(!story.id)return;
      const scenes=(story.scenes||[]).slice().sort((a,b)=>Number(a.sort_order)-Number(b.sort_order)||Number(a.id)-Number(b.id));
      const liveForStory=state.session?.state==='active'&&Number(state.session.story?.id)===Number(story.id);
      const sessionCard=node('div',undefined,'card');sessionCard.append(node('h3','Session controls'));
      if(liveForStory){
        sessionCard.append(node('p','This story is live. Current beat: '+(state.session.scene?.title||'Waiting for the flow')+'.','muted'));
        if(state.session.flow){
          const flowState=state.session.flow,flowStatus=node('span',(flowState.state||'running').toUpperCase()+(flowState.waiting?' · WAITING: '+flowState.waiting.toUpperCase():''),'tag');sessionCard.append(flowStatus);
          if(flowState.error)sessionCard.append(node('p',flowState.error,'muted'));
          const flowControl=node('button',flowState.state==='paused'?'Resume flow':'Pause flow');flowControl.onclick=()=>send(flowState.state==='paused'?'sessionResume':'sessionPause');
          const stop=node('button','End live session','danger');stop.onclick=()=>confirmAction('End the live flow for “'+story.title+'”?',()=>send('sessionStop'));
          sessionCard.append(flowControl,stop);
        }else{
          const next=node('button','Advance to next scene');next.onclick=()=>send('sessionNext');
          const stop=node('button','End live session','danger');stop.onclick=()=>confirmAction('End the live session for “'+story.title+'”?',()=>send('sessionStop'));
          sessionCard.append(next,stop);
        }
      }else if(state.session?.state==='active'){
        sessionCard.append(node('p','“'+(state.session.story?.title||'Another story')+'” is currently live. End it before starting this arc.','muted'));
      }else if(story.status!=='published'){
        sessionCard.append(node('p','Publish this story before starting a live session.','muted'));
      }else if(!scenes.length){
        sessionCard.append(node('p','Add at least one scene beat before starting a live session.','muted'));
      }else{
        sessionCard.append(node('p',story.flow?.nodes?.length?'Starting a session automatically runs this story’s saved flow.':'Starting a session announces the first scene beat to the audience chosen below.','muted'));
        const start=node('button','Start live session');
        start.onclick=()=>confirmAction('Start “'+story.title+'” for the chosen audience?',()=>send('sessionStart',{storyId:story.id,audienceMode:sessionAudienceMode,participantIds:sessionParticipants,areaId:sessionAudienceAreaId}));
        sessionCard.append(start);
      }
      content.append(sessionCard);
      if(!state.session?.state&&story.status==='published'&&scenes.length){
        const audienceCard=node('div',undefined,'card');audienceCard.append(node('h3','Session audience'));
        const audienceMode=node('select');for(const [id,label] of [['all','All online players'],['selected','Selected players only'],['area','Players inside a saved area']]){const option=node('option',label);option.value=id;audienceMode.append(option)}
        if(!['all','selected','area'].includes(sessionAudienceMode))sessionAudienceMode='all';audienceMode.value=sessionAudienceMode;
        audienceMode.onchange=()=>{sessionAudienceMode=audienceMode.value;render()};audienceCard.append(audienceMode);
        if(sessionAudienceMode==='selected'){
          const players=state.players||[];audienceCard.append(node('p','Only checked players receive the live beat and objective overlay.','muted'));
          if(!players.length)audienceCard.append(node('p','No online players are available.','muted'));
          for(const player of players){const check=document.createElement('input');check.type='checkbox';check.checked=sessionParticipants.map(Number).includes(Number(player.id));const label=node('label',player.name+' (#'+player.id+')');label.prepend(check);check.onchange=()=>{const id=Number(player.id);const values=new Set(sessionParticipants.map(Number));if(check.checked)values.add(id);else values.delete(id);sessionParticipants=[...values]};audienceCard.append(label)}
        }else if(sessionAudienceMode==='area'){
          const areas=state.areas||[],areaPicker=node('select');areaPicker.append(node('option','Choose a saved area'));areaPicker.options[0].value='';
          for(const area of areas){const option=node('option',area.label+' ('+area.shape+')');option.value=String(area.id);areaPicker.append(option)}
          if(sessionAudienceAreaId!=null&&!areas.some(area=>String(area.id)===String(sessionAudienceAreaId)))sessionAudienceAreaId=null;

  <script>
    (() => {
      const overlay = document.getElementById('cutscene-overlay');
      const effect = document.getElementById('story-effect-overlay');
      let effectTimer = null;
      window.addEventListener('message', event => {
        const data = event.data || {};
        if (data.action === 'cutsceneOverlay' && overlay) {
          overlay.textContent = String(data.message || '');
          overlay.style.display = data.visible && overlay.textContent ? 'block' : 'none';
        } else if (data.action === 'storyEffectMessage' && effect) {
          clearTimeout(effectTimer);
          effect.textContent = String(data.text || '');
          effect.style.display = effect.textContent ? 'block' : 'none';
          effect.style.top = data.kind === 'subtitle' ? 'auto' : '14%';
          effect.style.bottom = data.kind === 'subtitle' ? '10%' : 'auto';
          effectTimer = setTimeout(() => { effect.style.display = 'none'; }, Math.max(1, Math.min(30, Number(data.duration) || 5)) * 1000);
        } else if (data.action === 'storyEffectCleanup' && effect) {
          clearTimeout(effectTimer);
          effect.style.display = 'none';
          if (overlay) overlay.style.display = 'none';
        }
      });
    })();
